services:
  backend:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_generated_prisma:/app/src/generated

volumes:
  backend_node_modules:
  backend_generated_prisma:
